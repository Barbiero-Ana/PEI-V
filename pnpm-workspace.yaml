packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # O PostgreSQL descartável dos testes usa um binário por sistema.
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
# Dependências "içadas" direto em node_modules (sem a pasta .pnpm e sem links), como a Expo recomenda
# para monorepos. Necessário no Windows: o build nativo do Android (ninja/CMake) falha com caminhos acima
# de 260 caracteres, e a estrutura aninhada do pnpm passava desse limite (reanimated, async-storage).
nodeLinker: hoisted
# Baixa só os binários do sistema de quem instala (não tenta macOS/Linux no Windows e vice-versa).
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current]
